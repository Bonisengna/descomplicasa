name: Build and publish release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_revision:
        description: Exact SHA of the current production release to deliver again
        required: false
        type: string

concurrency:
  group: descomplicaza-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.release_revision == ''
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.20.2
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Confirm ARM64 build architecture
        run: test "$(uname -m)" = "aarch64"

      - name: Block high and critical dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Build the standalone application
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          SITE_URL: ${{ vars.SITE_URL || 'https://descomplicaza.caza85imoveis.com.br' }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
        run: npm run build

      - name: Validate deployment shell scripts
        run: |
          set -euo pipefail
          for script in ops/*.sh ops/runit/run ops/runit/log/run ops/runit/pull/run ops/runit/pull/log/run; do
            sh -n "$script"
          done

      - name: Assemble immutable release
        env:
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist/release/.next
          cp -a .next/standalone/. dist/release/
          cp -a .next/static dist/release/.next/static
          cp -a public dist/release/public
          printf '%s\n' "$RELEASE_ID" > dist/release/REVISION
          tar -C dist/release -czf dist/descomplicaza.tar.gz .
          (
            cd dist
            sha256sum descomplicaza.tar.gz > descomplicaza.tar.gz.sha256
          )

      - name: Test activation, idempotence, failure recovery and rollback
        run: ops/test-release-scripts.sh dist/descomplicaza.tar.gz dist/descomplicaza.tar.gz.sha256

      - name: Test release discovery and verified download
        run: ops/test-pull-release.sh

      - name: Test authenticated deployment signals
        run: node --test ops/test-deploy-signal.mjs

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: descomplicaza-${{ github.sha }}
          path: |
            dist/descomplicaza.tar.gz
            dist/descomplicaza.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
    steps:
      - name: Download the exact build artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: descomplicaza-${{ github.sha }}
          path: dist

      - name: Validate release files
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check descomplicaza.tar.gz.sha256
          test -s descomplicaza.tar.gz

      - name: Publish release for the phone to retrieve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="deploy-$RELEASE_ID"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            target=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')
            test "$target" = "$RELEASE_ID"
            assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name] | sort | join(" ")')
            test "$assets" = "descomplicaza.tar.gz descomplicaza.tar.gz.sha256"
            printf 'Release %s already exists with the expected immutable assets.\n' "$tag"
            exit 0
          fi

          gh release create "$tag" \
            dist/descomplicaza.tar.gz \
            dist/descomplicaza.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_ID" \
            --title "Deploy $RELEASE_ID" \
            --notes "ARM64 production candidate built and validated by GitHub Actions."

  deliver:
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && needs.publish.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.release_revision != ''))
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      id-token: write
    steps:
      - name: Join the private tailnet as an ephemeral runner
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ secrets.DEPLOY_SIGNAL_HOST }}

      - name: Signal the exact published revision
        env:
          RELEASE_ID: ${{ inputs.release_revision || github.sha }}
          SIGNAL_HOST: ${{ secrets.DEPLOY_SIGNAL_HOST }}
          SIGNAL_TOKEN: ${{ secrets.DEPLOY_SIGNAL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SIGNAL_HOST"
          [[ "$SIGNAL_TOKEN" =~ ^[a-f0-9]{64}$ ]]
          [[ "$RELEASE_ID" =~ ^[a-f0-9]{40}$ ]]
          curl --noproxy '*' --silent --show-error --fail-with-body --connect-timeout 15 --max-time 480 \
            --header "Authorization: Bearer $SIGNAL_TOKEN" --request POST \
            "http://$SIGNAL_HOST:8787/deploy/$RELEASE_ID" \
            | jq -e --arg sha "$RELEASE_ID" '.status == "ok" and .revision == $sha'

      - name: Verify the public revision
        env:
          RELEASE_ID: ${{ inputs.release_revision || github.sha }}
          SITE_URL: ${{ vars.SITE_URL || 'https://descomplicaza.caza85imoveis.com.br' }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 120))
          response="$RUNNER_TEMP/descomplicaza-health.json"
          while (( SECONDS < deadline )); do
            if status=$(curl --silent --connect-timeout 4 --max-time 6 --output "$response" \
              --write-out '%{http_code}' "${SITE_URL%/}/api/health"); then
              if [[ "$status" == 403 ]]; then
                echo "::warning::The public domain rejected the GitHub runner (HTTP 403). The phone verified the deployed SHA and n8n. Verify the public route from an approved network."
                exit 0
              fi
              if [[ "$status" == 200 ]] && jq -e --arg sha "$RELEASE_ID" \
                '.status == "ok" and .revision == $sha' "$response" >/dev/null; then
                printf 'Public revision %s is healthy.\n' "$RELEASE_ID"
                exit 0
              fi
            fi
            sleep 5
          done
          printf 'Public health did not confirm revision %s within 120 seconds.\n' "$RELEASE_ID" >&2
          exit 1
