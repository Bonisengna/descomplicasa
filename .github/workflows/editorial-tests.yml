name: Editorial contract tests
on:
  pull_request:
    paths:
      - 'lib/editorial-store.ts'
      - 'tests/editorial.test.mjs'
      - 'automation/editorial/**'
      - '.github/workflows/editorial-tests.yml'
  push:
    branches: [main]
    paths:
      - 'lib/editorial-store.ts'
      - 'tests/editorial.test.mjs'
      - 'automation/editorial/**'
      - '.github/workflows/editorial-tests.yml'
permissions:
  contents: read
jobs:
  editorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26'
      - name: Test publication and workflow contracts
        run: node --experimental-strip-types --test tests/editorial.test.mjs
